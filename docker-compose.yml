# Uso: crie um .env a partir de .env.example (MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD, SECRET_KEY)
# e rode: docker compose up --build
services:
  db:
    image: mysql:8.0
    container_name: ametist_astralys_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DB:-usuario}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    ports:
      - "127.0.0.1:3306:3306"  # só acessível a partir desta máquina
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ametist_astralys_api
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-usuario}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (mínimo 32 caracteres)}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
